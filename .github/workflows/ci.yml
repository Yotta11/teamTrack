# Pipeline CI/CD TeamTrack (section 11.2 du cahier des charges)
name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  api:
    name: API — build, lint, tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamtrack
          POSTGRES_PASSWORD: teamtrack
          POSTGRES_DB: teamtrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teamtrack" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://teamtrack:teamtrack@localhost:5432/teamtrack_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 1. Build
        run: npm ci && npm run build
      - name: 2. Lint
        run: npm run lint
      - name: 3. Tests unitaires et d'intégration (couverture >= 70 %)
        run: npm run test:coverage
      - name: 4. Analyse de sécurité
        run: npm audit --omit=dev --audit-level=critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture-api
          path: server/coverage

  web:
    name: Front — build, lint, tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: 2. Lint
        run: npm run lint
      - name: 3. Tests
        run: npm test
      - name: 1. Build
        run: npm run build
      - name: 4. Analyse de sécurité
        run: npm audit --omit=dev --audit-level=critical

  images:
    name: 5. Images Docker
    if: github.event_name == 'push'
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ env.REGISTRY }}/teamtrack-api:${{ github.sha }},${{ env.REGISTRY }}/teamtrack-api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: client
          push: true
          build-args: VITE_SHOW_DEMO=${{ github.ref_name == 'develop' }}
          tags: ${{ env.REGISTRY }}/teamtrack-web:${{ github.sha }},${{ env.REGISTRY }}/teamtrack-web:${{ github.ref_name }}

  staging:
    name: 6. Déploiement préproduction
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Déployer et tester
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: cd /opt/teamtrack && TAG=${{ github.sha }} ./deploy/deploy.sh
      - name: Test de fumée
        run: curl -fsS ${{ vars.STAGING_URL }}/health

  production:
    name: 7. Déploiement production (validation manuelle)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    environment: production # validation manuelle configurée dans les paramètres GitHub
    steps:
      - name: Déployer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: cd /opt/teamtrack && TAG=${{ github.sha }} ./deploy/deploy.sh
      - name: Contrôle de santé
        run: curl -fsS ${{ vars.PROD_URL }}/health
