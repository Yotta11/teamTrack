# Nginx du VPS (reverse proxy HTTPS) — à placer dans /etc/nginx/sites-available/teamtrack
# Certificat : sudo certbot --nginx -d teamtrack.votre-domaine.com
server {
  listen 80;
  server_name teamtrack.votre-domaine.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name teamtrack.votre-domaine.com;

  ssl_certificate     /etc/letsencrypt/live/teamtrack.votre-domaine.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/teamtrack.votre-domaine.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 12m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
